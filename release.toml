# cargo-release configuration for the whole workspace.
# Usage: `task release:dry -- minor`, then `task release -- minor`.

# Release from main, and alphas of 0.3 from feature/0.3; all crates share
# one version and one tag.
allow-branch = ["main", "feature/0.3"]
shared-version = true
consolidate-commits = true
tag-name = "v{{version}}"
pre-release-commit-message = "Release {{version}}"
tag-message = "Release {{version}}"

# Crates are published in dependency order; push the commit and tag afterwards.
publish = true
push = true
