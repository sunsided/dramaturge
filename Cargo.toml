[workspace]
resolver = "3"
members = [
    "crates/dramaturge",
    "crates/dramaturge-authoring",
    "crates/dramaturge-macros",
    "crates/dramaturge-model",
    "crates/dramaturge-runtime",
    "crates/dramaturge-serde",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "EUPL-1.2 OR MIT OR Apache-2.0"
authors = ["dramaturge contributors"]
repository = "https://github.com/sunsided/dramaturge"
keywords = ["dialogue", "narrative", "game", "branching"]
categories = ["game-development"]

[workspace.dependencies]
dramaturge-authoring = { path = "crates/dramaturge-authoring", version = "0.1.0" }
dramaturge-macros = { path = "crates/dramaturge-macros", version = "0.1.0" }
dramaturge-model = { path = "crates/dramaturge-model", version = "0.1.0" }
dramaturge-runtime = { path = "crates/dramaturge-runtime", version = "0.1.0" }
dramaturge-serde = { path = "crates/dramaturge-serde", version = "0.1.0" }
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full"] }
assert2 = "0.4"
