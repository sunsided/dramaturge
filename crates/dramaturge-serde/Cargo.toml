[package]
name = "dramaturge-serde"
description = "Optional serialization integration for the dramaturge dialogue toolkit."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
features = ["yaml"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
yaml = ["dep:serde-saphyr"]

[dependencies]
dramaturge-model = { workspace = true }
dramaturge-runtime = { workspace = true }
serde = { workspace = true }
serde-saphyr = { version = "2", optional = true, default-features = false, features = ["deserialize"] }

[dev-dependencies]
assert2 = { workspace = true }
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
