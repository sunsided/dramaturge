# The Broken Seal - dialogue for the dramaturge example.
# Branching dialogue with hidden observations, in the dialogue shape of
# dramaturge 0.3 (see docs/migration-0.3-yaml.md).

with: mara
start: [mara.intro]

nodes:

  # Scene 1: Mara Intro
  mara.intro:
    say: "If you came about the missing shipment, I already told the Wardens everything I can."
    options:
      - id: mara.intro.comfort
        say: "You treated someone with that medicine, didn't you? I'm not here to punish that."
        tags:
          - { axis: moral, key: paragon }
          - { axis: skill, key: medic }
          - { axis: speech, key: comfort }
        intentions: { explicit: [GainTrust], implicit: [ProtectVulnerable, ExtractConfessionSoftly] }
        set: { PlayerComfortedMara: true }
        relation: { trust: 15 }
        go: mara.confession.soft
      - id: mara.intro.ledger
        say: "The ledger says three crates vanished after your signature."
        tags:
          - { axis: moral, key: pragmatic }
          - { axis: skill, key: investigator }
          - { axis: speech, key: ask }
        intentions: { explicit: [ExtractInformation], implicit: [PressureWitness] }
        go: mara.confession.guarded
      - id: mara.intro.threaten
        say: "Don't waste my time. Tell me where the crates went."
        tags:
          - { axis: moral, key: renegade }
          - { axis: skill, key: intimidation }
          - { axis: speech, key: accuse }
        intentions: { explicit: [Intimidate], implicit: [CloseCaseQuickly] }
        set: { PlayerThreatenedMara: true }
        relation: { trust: -15 }
        go: mara.confession.forced
      - id: mara.intro.accuse
        say: "You're a thief and a liar. I should drag you to the stocks right now."
        tags:
          - { axis: moral, key: renegade }
          - { axis: speech, key: accuse }
        intentions: { explicit: [Intimidate], implicit: [ForceConfession] }
        set: { PlayerThreatenedMara: true }
        relation: { trust: -25 }
        go: mara.refused

  # Mara Confession Soft (comfort path)
  mara.confession.soft:
    say: "*sighs* Yes. The refugee camp beyond the east wall. Three children with fever. Their parents begged me... I couldn't just watch them die."
    set: { TalkedToMara: true, MaraRevealedDiversion: true, MedicineDivertedToRefugees: true }
    options:
      - id: mara.confession.soft.promise
        say: "I'll speak carefully. The truth matters, but so do the people you saved."
        tags:
          - { axis: moral, key: paragon }
          - { axis: speech, key: promise }
          - { axis: social, key: confidential }
        intentions: { explicit: [KeepPromise], implicit: [Comfort] }
        set: { PlayerPromisedMaraDiscretion: true }
        relation: { trust: 10 }
        go: mara.promise
      - id: mara.confession.soft.honest
        say: "I won't hide this. Orren needs to know what happened."
        tags:
          - { axis: moral, key: pragmatic }
          - { axis: speech, key: truth }
          - { axis: social, key: public }
        intentions: { explicit: [Reveal] }
        set: { PlayerRefusedDiscretion: true }
        relation: { trust: -5 }
        go: mara.promise

  # Mara Confession Guarded (investigator path)
  mara.confession.guarded:
    say: "The ledgers... *clenches jaw* The Civic Wardens would have let those children die for paperwork. I made a choice. The crates are at the east wall camp."
    set: { TalkedToMara: true, MaraRevealedDiversion: true, MedicineDivertedToRefugees: true }
    options:
      - id: mara.confession.guarded.continue
        hint: continue
        go: mara.promise

  # Mara Confession Forced (intimidation path)
  mara.confession.forced:
    say: "*voice trembling* The east wall. The refugee camp. Take what you want, just... leave me be."
    set: { TalkedToMara: true, MaraRevealedDiversion: true, MedicineDivertedToRefugees: true }
    options:
      - id: mara.confession.forced.continue
        hint: leave
        go: mara.promise

  # Mara Promise Choice (transition to Orren)
  mara.promise:
    say:
      - "Whatever happens... thank you for hearing me out."
      - when: exists(PlayerPromisedMaraDiscretion)
        text: "And thank you for your discretion."
      - "Captain Vale is waiting in the council room."
    options:
      - id: mara.promise.go_to_orren
        hint: { go_to: "Captain Vale" }
        go: orren.intro

  # Mara Refused (aggressive accusation path)
  mara.refused:
    say: "*goes pale, then stiffens* I have nothing to say to you. If you have accusations, take them to Captain Vale. I'm done here."
    set: { TalkedToMara: true, MaraRefusedToTalk: true, PlayerLearnedNothing: true }
    options:
      - id: mara.refused.go_to_orren
        say: "Fine. I'll talk to Vale directly."
        hint: leave
        go: orren.intro

  # Scene 2: Orren Intro
  orren.intro:
    speaker: orren
    say:
      - mode: first_time
        text: "*Captain Vale looks up from a stack of ledgers.*"
      - "You spoke to Mara Vey. Good. Then you know whether my missing medicine is a theft, a clerical error, or something worse."
    options:
      - id: orren.intro.truth
        say: "Mara diverted the medicine to refugees outside the wall. She saved three children with fever."
        when: exists(TalkedToMara) and exists(MedicineDivertedToRefugees)
        tags:
          - { axis: moral, key: paragon }
          - { axis: skill, key: medic }
          - { axis: speech, key: truth }
          - { axis: social, key: faction_loyalty }
        intentions: { explicit: [Reveal, ProtectVulnerable], implicit: [GainOrrenRespect, FrameCrimeAsMercy, PreserveMaraFromHarshPunishment] }
        set: { PlayerToldOrrenTruth: true, OrrenRespectsPlayerHonesty: true, OrrenSoftensReport: true }
        relation: { trust: 10 }
        go: orren.truth
      - id: orren.intro.lie
        say: "Mara found the crates already missing. She had nothing to do with it."
        when: exists(MedicineDivertedToRefugees)
        tags:
          - { axis: moral, key: renegade }
          - { axis: skill, key: streetwise }
          - { axis: speech, key: lie }
          - { axis: social, key: confidential }
        intentions: { explicit: [Deceive], implicit: [ProtectMara] }
        set: { PlayerLiedToOrren: true }
        relation: { trust: -20 }
        go: orren.lie
      - id: orren.intro.half_truth
        say: "Mara did find the crates missing... after signing for them. She was trying to help someone."
        when: exists(MedicineDivertedToRefugees)
        tags:
          - { axis: moral, key: pragmatic }
          - { axis: skill, key: streetwise }
          - { axis: speech, key: lie }
          - { axis: social, key: confidential }
        intentions: { explicit: [DeceiveByOmission], implicit: [ProtectMara, TestOrrensGullibility] }
        set: { PlayerGaveHalfTruthToOrren: true }
        go: orren.pretends
      - id: orren.intro.bluff
        say: "She clammed up when I pressed her. My guess? Bandits hit the shipment before it reached the clinic."
        when: exists(MaraRefusedToTalk)
        tags:
          - { axis: moral, key: renegade }
          - { axis: skill, key: streetwise, prefix: "[Bluff]" }
          - { axis: speech, key: lie }
        intentions: { explicit: [Deceive], implicit: [BlindGuess] }
        set: { PlayerBluffedOrren: true }
        relation: { trust: -25 }
        go: orren.bluff
      - id: orren.intro.refuse
        say: "I gave Mara my word. Ask me what I saw, not what she trusted me with."
        when: exists(PlayerPromisedMaraDiscretion)
        tags:
          - { axis: moral, key: paragon }
          - { axis: speech, key: deflect }
          - { axis: social, key: confidential }
        intentions: { explicit: [KeepPromise], implicit: [EarnRespect] }
        set: { PlayerRefusedToBetrayMara: true }
        relation: { trust: 5 }
        then:
          - relation: { from: player, to: mara, axis: trust, delta: 5 }
        go: orren.refuse

  # Orren Truth Response
  orren.truth:
    speaker: orren
    say: "*nods slowly* I had my suspicions. Mercy is a virtue, but so is order. I'll... soften my report. The Free Clinic will make restitution. Mara keeps her position."
    relation: { trust: 5 }
    options:
      - id: orren.truth.thanks
        say: "Thank you, Captain."
        hint: end
        go: end

  # Orren Lie Response
  orren.lie:
    speaker: orren
    say: "*eyes narrow* I see. Then perhaps you can explain why I overheard her confession not an hour ago. You protect a thief and lie to my face?"
    options:
      - id: orren.lie.leave
        hint: end
        go: end

  # Orren Refuse Response
  orren.refuse:
    speaker: orren
    say: "*studies you for a long moment* A person who keeps their word, even when it's inconvenient. That's rare in Greyford. I won't press you further."
    relation: { trust: 5 }
    options:
      - id: orren.refuse.thanks
        say: "Thank you for understanding, Captain."
        hint: end
        go: end

  # Orren Pretends Belief
  orren.pretends:
    speaker: orren
    say: "*nods, expression unreadable* I appreciate your candor. These are difficult times, and difficult choices must be made. I'll... look into the matter personally."
    set: { OrrenPretendsToBelieve: true, OrrenPlottingToTestPlayer: true }
    relation: { trust: 5 }
    options:
      - id: orren.pretends.thanks
        say: "Thank you, Captain. I knew you'd understand."
        hint: end
        go: end

  # Orren Bluff Response (when player claims Mara clammed up)
  orren.bluff:
    speaker: orren
    say: "*chuckles dryly* Bandits. Of course. And I suppose the Wardens just happened to miss any sign of forced entry. You expect me to believe Mara Vey - who once talked her way out of a hanging - simply 'clammed up'?"
    set: { PlayerBluffFailed: true, OrrenKnowsPlayerLying: true }
    relation: { trust: -30 }
    options:
      - id: orren.bluff.leave
        hint: end
        go: end
