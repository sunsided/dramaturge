# The Broken Seal - Dialogue Configuration
# A dramaturge example demonstrating branching dialogue with hidden observations

version: "1.0"
entry_node: 1

characters:
  player:
    id: 1
    name: "Player"
  mara:
    id: 2
    name: "Mara Vey"
  orren:
    id: 3
    name: "Captain Orren Vale"

nodes:
  # Scene 1: Mara Intro
  - id: 1
    speaker: mara
    text: "If you came about the missing shipment, I already told the Wardens everything I can."
    options:
      - id: 1
        text: "You treated someone with that medicine, didn't you? I'm not here to punish that."
        tags:
          - { axis: "moral", key: "paragon" }
          - { axis: "skill", key: "medic" }
          - { axis: "speech", key: "comfort" }
        intentions_explicit: ["GainTrust"]
        intentions_implicit: ["ProtectVulnerable", "ExtractConfessionSoftly"]
        outcomes:
          - type: add_relationship
            source: 1
            target: 2
            axis: "trust"
            delta: 15
          - type: set_fact
            fact: "PlayerComfortedMara"
            value: true
        target: "2"
      - id: 2
        text: "The ledger says three crates vanished after your signature."
        tags:
          - { axis: "moral", key: "pragmatic" }
          - { axis: "skill", key: "investigator" }
          - { axis: "speech", key: "ask" }
        intentions_explicit: ["ExtractInformation"]
        intentions_implicit: ["PressureWitness"]
        target: "3"
      - id: 3
        text: "Don't waste my time. Tell me where the crates went."
        tags:
          - { axis: "moral", key: "renegade" }
          - { axis: "skill", key: "intimidation" }
          - { axis: "speech", key: "accuse" }
        intentions_explicit: ["Intimidate"]
        intentions_implicit: ["CloseCaseQuickly"]
        outcomes:
          - type: add_relationship
            source: 1
            target: 2
            axis: "trust"
            delta: -15
          - type: set_fact
            fact: "PlayerThreatenedMara"
            value: true
        target: "4"
      - id: 20
        text: "You're a thief and a liar. I should drag you to the stocks right now."
        tags:
          - { axis: "moral", key: "renegade" }
          - { axis: "speech", key: "accuse" }
        intentions_explicit: ["Intimidate"]
        intentions_implicit: ["ForceConfession"]
        outcomes:
          - type: add_relationship
            source: 1
            target: 2
            axis: "trust"
            delta: -25
          - type: set_fact
            fact: "PlayerThreatenedMara"
            value: true
        target: "6"

  # Node 2: Mara Confession Soft (comfort path)
  - id: 2
    speaker: mara
    text: "*sighs* Yes. The refugee camp beyond the east wall. Three children with fever. Their parents begged me... I couldn't just watch them die."
    outcomes:
      - type: set_fact
        fact: "TalkedToMara"
        value: true
      - type: set_fact
        fact: "MaraRevealedDiversion"
        value: true
      - type: set_fact
        fact: "MedicineDivertedToRefugees"
        value: true
    options:
      - id: 4
        text: "I'll speak carefully. The truth matters, but so do the people you saved."
        tags:
          - { axis: "moral", key: "paragon" }
          - { axis: "speech", key: "promise" }
          - { axis: "social", key: "confidential" }
        intentions_explicit: ["KeepPromise"]
        intentions_implicit: ["Comfort"]
        outcomes:
          - type: add_relationship
            source: 1
            target: 2
            axis: "trust"
            delta: 10
          - type: set_fact
            fact: "PlayerPromisedMaraDiscretion"
            value: true
        target: "5"
      - id: 5
        text: "I won't hide this. Orren needs to know what happened."
        tags:
          - { axis: "moral", key: "pragmatic" }
          - { axis: "speech", key: "truth" }
          - { axis: "social", key: "public" }
        intentions_explicit: ["Reveal"]
        outcomes:
          - type: add_relationship
            source: 1
            target: 2
            axis: "trust"
            delta: -5
          - type: set_fact
            fact: "PlayerRefusedDiscretion"
            value: true
        target: "5"

  # Node 3: Mara Confession Guarded (investigator path)
  - id: 3
    speaker: mara
    text: "The ledgers... *clenches jaw* The Civic Wardens would have let those children die for paperwork. I made a choice. The crates are at the east wall camp."
    outcomes:
      - type: set_fact
        fact: "TalkedToMara"
        value: true
      - type: set_fact
        fact: "MaraRevealedDiversion"
        value: true
      - type: set_fact
        fact: "MedicineDivertedToRefugees"
        value: true
    options:
      - id: 6
        navigation_hint: continue
        target: "5"

  # Node 4: Mara Confession Forced (intimidation path)
  - id: 4
    speaker: mara
    text: "*voice trembling* The east wall. The refugee camp. Take what you want, just... leave me be."
    outcomes:
      - type: set_fact
        fact: "TalkedToMara"
        value: true
      - type: set_fact
        fact: "MaraRevealedDiversion"
        value: true
      - type: set_fact
        fact: "MedicineDivertedToRefugees"
        value: true
    options:
      - id: 7
        navigation_hint: leave
        target: "5"

  # Node 5: Mara Promise Choice (transition to Orren)
  - id: 5
    speaker: mara
    text: "Whatever happens... thank you for hearing me out. Captain Vale is waiting in the council room."
    options:
      - id: 8
        navigation_hint: go_to
        go_to_target: "Captain Vale"
        target: "10"

  # Node 6: Mara Refused (aggressive accusation path)
  - id: 6
    speaker: mara
    text: "*goes pale, then stiffens* I have nothing to say to you. If you have accusations, take them to Captain Vale. I'm done here."
    outcomes:
      - type: set_fact
        fact: "TalkedToMara"
        value: true
      - type: set_fact
        fact: "MaraRefusedToTalk"
        value: true
      - type: set_fact
        fact: "PlayerLearnedNothing"
        value: true
    options:
      - id: 21
        navigation_hint: leave
        text: "Fine. I'll talk to Vale directly."
        target: "10"

  # Scene 2: Orren Intro
  - id: 10
    speaker: orren
    text: "You spoke to Mara Vey. Good. Then you know whether my missing medicine is a theft, a clerical error, or something worse."
    options:
      - id: 10
        text: "Mara diverted the medicine to refugees outside the wall. She saved three children with fever."
        tags:
          - { axis: "moral", key: "paragon" }
          - { axis: "skill", key: "medic" }
          - { axis: "speech", key: "truth" }
          - { axis: "social", key: "faction_loyalty" }
        intentions_explicit: ["Reveal", "ProtectVulnerable"]
        intentions_implicit: ["GainOrrenRespect", "FrameCrimeAsMercy", "PreserveMaraFromHarshPunishment"]
        conditions:
          - type: fact_exists
            fact: "TalkedToMara"
          - type: fact_exists
            fact: "MedicineDivertedToRefugees"
        outcomes:
          - type: add_relationship
            source: 1
            target: 3
            axis: "trust"
            delta: 10
          - type: set_fact
            fact: "PlayerToldOrrenTruth"
            value: true
          - type: set_fact
            fact: "OrrenRespectsPlayerHonesty"
            value: true
          - type: set_fact
            fact: "OrrenSoftensReport"
            value: true
        target: "11"
      - id: 11
        text: "Mara found the crates already missing. She had nothing to do with it."
        tags:
          - { axis: "moral", key: "renegade" }
          - { axis: "skill", key: "streetwise" }
          - { axis: "speech", key: "lie" }
          - { axis: "social", key: "confidential" }
        intentions_explicit: ["Deceive"]
        intentions_implicit: ["ProtectMara"]
        conditions:
          - type: fact_exists
            fact: "MedicineDivertedToRefugees"
        outcomes:
          - type: add_relationship
            source: 1
            target: 3
            axis: "trust"
            delta: -20
          - type: set_fact
            fact: "PlayerLiedToOrren"
            value: true
        target: "12"
      - id: 16
        text: "Mara did find the crates missing... after signing for them. She was trying to help someone."
        tags:
          - { axis: "moral", key: "pragmatic" }
          - { axis: "skill", key: "streetwise" }
          - { axis: "speech", key: "lie" }
          - { axis: "social", key: "confidential" }
        intentions_explicit: ["DeceiveByOmission"]
        intentions_implicit: ["ProtectMara", "TestOrrensGullibility"]
        conditions:
          - type: fact_exists
            fact: "MedicineDivertedToRefugees"
        outcomes:
          - type: set_fact
            fact: "PlayerGaveHalfTruthToOrren"
            value: true
        target: "14"
      - id: 22
        text: "She clammed up when I pressed her. My guess? Bandits hit the shipment before it reached the clinic."
        tags:
          - { axis: "moral", key: "renegade" }
          - { axis: "skill", key: "streetwise", display_prefix: "[Bluff]" }
          - { axis: "speech", key: "lie" }
        intentions_explicit: ["Deceive"]
        intentions_implicit: ["BlindGuess"]
        conditions:
          - type: fact_exists
            fact: "MaraRefusedToTalk"
        outcomes:
          - type: add_relationship
            source: 1
            target: 3
            axis: "trust"
            delta: -25
          - type: set_fact
            fact: "PlayerBluffedOrren"
            value: true
        target: "15"
      - id: 12
        text: "I gave Mara my word. Ask me what I saw, not what she trusted me with."
        tags:
          - { axis: "moral", key: "paragon" }
          - { axis: "speech", key: "deflect" }
          - { axis: "social", key: "confidential" }
        intentions_explicit: ["KeepPromise"]
        intentions_implicit: ["EarnRespect"]
        conditions:
          - type: fact_exists
            fact: "PlayerPromisedMaraDiscretion"
        outcomes:
          - type: add_relationship
            source: 1
            target: 3
            axis: "trust"
            delta: 5
          - type: add_relationship
            source: 1
            target: 2
            axis: "trust"
            delta: 5
          - type: set_fact
            fact: "PlayerRefusedToBetrayMara"
            value: true
        target: "13"

  # Node 11: Orren Truth Response
  - id: 11
    speaker: orren
    text: "*nods slowly* I had my suspicions. Mercy is a virtue, but so is order. I'll... soften my report. The Free Clinic will make restitution. Mara keeps her position."
    outcomes:
      - type: add_relationship
        source: 1
        target: 3
        axis: "trust"
        delta: 5
    options:
      - id: 13
        navigation_hint: end
        text: "Thank you, Captain."
        target: "end"

  # Node 12: Orren Lie Response
  - id: 12
    speaker: orren
    text: "*eyes narrow* I see. Then perhaps you can explain why I overheard her confession not an hour ago. You protect a thief and lie to my face?"
    options:
      - id: 14
        navigation_hint: end
        target: "end"

  # Node 13: Orren Refuse Response
  - id: 13
    speaker: orren
    text: "*studies you for a long moment* A person who keeps their word, even when it's inconvenient. That's rare in Greyford. I won't press you further."
    outcomes:
      - type: add_relationship
        source: 1
        target: 3
        axis: "trust"
        delta: 5
    options:
      - id: 15
        navigation_hint: end
        text: "Thank you for understanding, Captain."
        target: "end"

  # Node 14: Orren Pretends Belief
  - id: 14
    speaker: orren
    text: "*nods, expression unreadable* I appreciate your candor. These are difficult times, and difficult choices must be made. I'll... look into the matter personally."
    outcomes:
      - type: add_relationship
        source: 1
        target: 3
        axis: "trust"
        delta: 5
      - type: set_fact
        fact: "OrrenPretendsToBelieve"
        value: true
      - type: set_fact
        fact: "OrrenPlottingToTestPlayer"
        value: true
    options:
      - id: 17
        navigation_hint: end
        text: "Thank you, Captain. I knew you'd understand."
        target: "end"

  # Node 15: Orren Bluff Response (when player claims Mara clammed up)
  - id: 15
    speaker: orren
    text: "*chuckles dryly* Bandits. Of course. And I suppose the Wardens just happened to miss any sign of forced entry. You expect me to believe Mara Vey - who once talked her way out of a hanging - simply 'clammed up'?"
    outcomes:
      - type: add_relationship
        source: 1
        target: 3
        axis: "trust"
        delta: -30
      - type: set_fact
        fact: "PlayerBluffFailed"
        value: true
      - type: set_fact
        fact: "OrrenKnowsPlayerLying"
        value: true
    options:
      - id: 23
        navigation_hint: end
        target: "end"
