[package]
name = "dramaturge"
description = "A Rust toolkit for branching dialogue, character memory, and narrative state."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
features = ["yaml"]
rustdoc-args = ["--cfg", "docsrs"]

# The workspace changelog is rotated once, with the facade crate's release.
[package.metadata.release]
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
    { file = "../../CHANGELOG.md", search = "\\[Unreleased\\]: (https://github.com/sunsided/dramaturge/compare)/(v[^ ]+?)\\.\\.\\.HEAD", replace = "[Unreleased]: ${1}/v{{version}}...HEAD\n[{{version}}]: ${1}/${2}...v{{version}}", exactly = 1 },
]

[features]
serde = ["dep:dramaturge-serde"]
yaml = ["dep:dramaturge-serde", "dramaturge-serde/yaml"]

[dependencies]
dramaturge-model = { workspace = true }
dramaturge-runtime = { workspace = true }
dramaturge-serde = { workspace = true, optional = true }

[dev-dependencies]
assert2 = { workspace = true }
dramaturge-authoring = { workspace = true }

[[example]]
name = "the_broken_seal"
path = "examples/the_broken_seal.rs"
required-features = ["yaml"]
